spring:
  application:
    name: api-platform
  profiles:
    active: ${APP_PROFILE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDR:127.0.0.1:3306}/${APP_DATABASE:api_platform}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  redis:
    redisson:
      config: |
        useScriptCache: true
        singleServerConfig:
          address: redis://${REDIS_ADDR:127.0.0.1:6379}
          database: ${REDIS_DATABASE:0}
          username: ${REDIS_USERNAME:root}
          password: ${REDIS_PASSWORD:123456}
          clientName: api-platform
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        enabled: true
        register-enabled: true
        service: ${spring.application.name}
        ip-type: IPv4
        namespace: ${NACOS_NAMESPACE}
        group: ${spring.profiles.active}
  config:
    import:
      - file:./private/mail.yml
  mail:
    default-encoding: utf-8
server:
  port: 8080
  servlet:
    context-path: /api-platform
dubbo:
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: -1
  registry:
    id: nacos
    address: nacos://${spring.cloud.nacos.server-addr}?namespace=${spring.cloud.nacos.discovery.namespace}
    group: dubbo-${spring.profiles.active}
    register-mode: instance
api-platform:
  login:
    white-list:
      - /doc.html
      - /webjars/**
      - /favicon.ico
      - /swagger-ui.html
      - /v3/api-docs/**
      - /email/captcha
      - /oss/file
      - /user/login
      - /user/register
      - /user/passwd
      - /oss/static/**
      - GET,/http-api/*
      - /http-api/search
      - GET,/comment
      - GET,/comment/reply
logging:
  level:
    io.github.liruohrh.apiplatform.exception: warn
